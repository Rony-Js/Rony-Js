 name: Build PDFs

on:
  push:
    branches: [main]
    paths:
      - 'cv/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Pandoc + LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended

      - name: Generar CV Profesional
        run: pandoc cv/cv-profesional.md -o cv/cv-profesional.pdf -V geometry:margin=2cm -V mainfont="DejaVu Sans"

      - name: Commit PDFs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add **/*.pdf
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generar PDFs [skip ci]"
          git push
