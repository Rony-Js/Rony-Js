name: Update Codeforces Cards

on:
  schedule:
    - cron: "0 0 * * *"        # diario a medianoche UTC
  workflow_dispatch:            # botón manual
  push:
    branches: [main]
    paths:
      - "assets/generate_cf_card.py"
      - ".github/workflows/codeforces-card.yml"
      
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate SVGs
        run: python assets/generate_cf_card.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "chore: update Codeforces stats [skip ci]"
            git push
          fi
