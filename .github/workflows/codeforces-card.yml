name: Update Codeforces Card

on:
  schedule:
    - cron: "0 0 * * *"      # todos los días a las 00:00 UTC
  workflow_dispatch:          # botón para ejecutarlo manualmente
  push:
    branches: [main]

jobs:
  update-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # necesario para hacer push del SVG

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate SVG
        run: python assets/generate_cf_card.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/codeforces-stats.svg
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: update Codeforces stats [skip ci]"
            git push
          fi